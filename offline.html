<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>غير متصل - ريال ودولار</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
        .offline-container { max-width: 400px; }
        .offline-icon { font-size: 80px; margin-bottom: 20px; }
        .offline-title { font-size: 24px; margin-bottom: 10px; color: #f59e0b; }
        .offline-text { font-size: 16px; color: #94a3b8; margin-bottom: 30px; line-height: 1.6; }
        .retry-btn { background: #f59e0b; color: #0f172a; border: none; padding: 12px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .retry-btn:hover { opacity: 0.9; }
        .cached-info { margin-top: 20px; padding: 15px; background: rgba(245,158,11,0.1); border-radius: 8px; font-size: 14px; color: #fbbf24; }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1 class="offline-title">أنت غير متصل بالإنترنت</h1>
        <p class="offline-text">لا يمكن تحميل الصفحة حالياً. بعض البيانات المحفوظة قد تكون متاحة للعرض.</p>
        <button class="retry-btn" onclick="location.reload()">إعادة المحاولة</button>
        <div class="cached-info">💡 تلميح: يمكنك عرض البيانات المحفوظة سابقاً</div>
    </div>
</body>
</html>
