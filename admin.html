<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | ريال ودولار</title>
    <style>
        :root { --primary: #f59e0b; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary); margin: 20px 0; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; margin: 15px 0; }
        h3 { color: var(--primary); margin-bottom: 15px; }
        .row { display: flex; gap: 10px; margin: 10px 0; align-items: center; }
        .row label { width: 100px; color: #94a3b8; font-size: 0.9rem; }
        input { flex: 1; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: var(--text); font-size: 0.95rem; }
        button { width: 100%; padding: 14px; background: var(--primary); color: #0f172a; border: none; border-radius: 12px; font-weight: 700; font-size: 1.1rem; cursor: pointer; margin: 10px 0; }
        textarea { width: 100%; height: 200px; margin: 10px 0; padding: 15px; background: #000; border: 2px solid var(--primary); border-radius: 12px; color: #fff; font-family: monospace; font-size: 0.85rem; }
        .msg { text-align: center; padding: 15px; border-radius: 10px; margin: 10px 0; }
        .success { background: #065f46; color: #34d399; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🪙 لوحة تحكم ريال ودولار</h1>
        
        <div class="card">
            <h3>📍 صنعاء</h3>
            <div class="row"><label>💵 دولار شراء:</label><input type="number" id="s1" step="0.01"></div>
            <div class="row"><label>💵 دولار بيع:</label><input type="number" id="s2" step="0.01"></div>
            <div class="row"><label>🇸🇦 سعودي شراء:</label><input type="number" id="s3" step="0.01"></div>
            <div class="row"><label>🇸🇦 سعودي بيع:</label><input type="number" id="s4" step="0.01"></div>
            <div class="row"><label>🥇 ذهب 21 شراء:</label><input type="number" id="s5" step="0.01"></div>
            <div class="row"><label>🥇 ذهب 21 بيع:</label><input type="number" id="s6" step="0.01"></div>
        </div>
        
        <div class="card">
            <h3>📍 عدن</h3>
            <div class="row"><label>💵 دولار شراء:</label><input type="number" id="a1" step="0.01"></div>
            <div class="row"><label>💵 دولار بيع:</label><input type="number" id="a2" step="0.01"></div>
            <div class="row"><label>🇸🇦 سعودي شراء:</label><input type="number" id="a3" step="0.01"></div>
            <div class="row"><label>🇸🇦 سعودي بيع:</label><input type="number" id="a4" step="0.01"></div>
            <div class="row"><label>🥇 ذهب 21 شراء:</label><input type="number" id="a5" step="0.01"></div>
            <div class="row"><label>🥇 ذهب 21 بيع:</label><input type="number" id="a6" step="0.01"></div>
        </div>
        
        <button onclick="generate()">📋 إنشاء JSON</button>
        <textarea id="output" placeholder="JSON سيظهر هنا..."></textarea>
        <button onclick="copyText()">📋 نسخ للكليبورد</button>
        <div id="msg"></div>
    </div>

    <script>
        async function load() {
            try {
                const r = await fetch("https://kaidngat4-droid.github.io/riyal-dollar-app/api/prices_data.json");
                const d = await r.json();
                const s = d.regions.sanaa, a = d.regions.aden;
                document.getElementById('s1').value = s.currencies.USD.buy;
                document.getElementById('s2').value = s.currencies.USD.sell;
                document.getElementById('s3').value = s.currencies.SAR.buy;
                document.getElementById('s4').value = s.currencies.SAR.sell;
                document.getElementById('s5').value = s.gold['21k'].buy;
                document.getElementById('s6').value = s.gold['21k'].sell;
                document.getElementById('a1').value = a.currencies.USD.buy;
                document.getElementById('a2').value = a.currencies.USD.sell;
                document.getElementById('a3').value = a.currencies.SAR.buy;
                document.getElementById('a4').value = a.currencies.SAR.sell;
                document.getElementById('a5').value = a.gold['21k'].buy;
                document.getElementById('a6').value = a.gold['21k'].sell;
            } catch(e) {}
        }
        
        function generate() {
            const ts = new Date().toISOString();
            const json = {
                metadata: { app_name: "ريال ودولار", version: "1.0.0", last_updated: ts, base_currency: "YER", data_source: "manual_update" },
                regions: {
                    sanaa: {
                        name: "صنعاء",
                        currencies: {
                            USD: { buy: +document.getElementById('s1').value, sell: +document.getElementById('s2').value },
                            SAR: { buy: +document.getElementById('s3').value, sell: +document.getElementById('s4').value }
                        },
                        gold: { "21k": { buy: +document.getElementById('s5').value, sell: +document.getElementById('s6').value, unit: "YER/gram" } }
                    },
                    aden: {
                        name: "عدن",
                        currencies: {
                            USD: { buy: +document.getElementById('a1').value, sell: +document.getElementById('a2').value },
                            SAR: { buy: +document.getElementById('a3').value, sell: +document.getElementById('a4').value }
                        },
                        gold: { "21k": { buy: +document.getElementById('a5').value, sell: +document.getElementById('a6').value, unit: "YER/gram" } }
                    }
                }
            };
            document.getElementById('output').value = JSON.stringify(json, null, 2);
            document.getElementById('msg').innerHTML = '<div class="msg success">✅ تم إنشاء JSON! اضغط نسخ ثم الصقه في GitHub</div>';
        }
        
        function copyText() {
            const text = document.getElementById('output').value;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                document.getElementById('msg').innerHTML = '<div class="msg success">✅ تم النسخ! اذهب لـ GitHub والصقه في api/prices_data.json</div>';
            });
        }
        
        load();
    </script>
</body>
</html>
