<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم | ريال ودولار</title>
    <style>
        :root { --primary: #f59e0b; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --border: #334155; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); padding:20px; }
        .container { max-width:750px; margin:0 auto; }
        h1 { text-align:center; color:var(--primary); margin:20px 0; }
        h2 { color:var(--primary); margin:15px 0 10px; font-size:1.1rem; }
        .card { background:var(--card); border-radius:16px; padding:20px; margin:15px 0; border:1px solid var(--border); }
        .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
        .field { margin-bottom:5px; }
        .field label { display:block; color:var(--muted); font-size:0.7rem; }
        .field input { width:100%; padding:10px; background:#0f172a; border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:0.85rem; }
        .field input:focus { border-color:var(--primary); outline:none; }
        button { width:100%; padding:14px; background:var(--primary); color:#0f172a; border:none; border-radius:12px; font-weight:700; font-size:1.1rem; cursor:pointer; margin:10px 0; }
        button:hover { opacity:0.9; }
        .btn-copy { background:#334155; color:#fff; }
        textarea { width:100%; height:200px; margin:10px 0; padding:15px; background:#000; border:2px solid var(--primary); border-radius:12px; color:#0f0; font-family:monospace; font-size:0.75rem; }
        .msg { text-align:center; padding:15px; border-radius:10px; margin:10px 0; }
        .success { background:#065f46; color:#34d399; }
    </style>
</head>
<body>
<div class="container">
    <h1>🪙 لوحة تحكم ريال ودولار</h1>

    <div class="card"><h2>📍 صنعاء - العملات</h2><div class="grid">
        <div class="field"><label>💵 دولار شراء</label><input type="number" id="s1" step="0.01"></div>
        <div class="field"><label>💵 دولار بيع</label><input type="number" id="s2" step="0.01"></div>
        <div class="field"><label>🇸🇦 سعودي شراء</label><input type="number" id="s3" step="0.01"></div>
        <div class="field"><label>🇸🇦 سعودي بيع</label><input type="number" id="s4" step="0.01"></div>
        <div class="field"><label>💶 يورو شراء</label><input type="number" id="s5" step="0.01"></div>
        <div class="field"><label>💶 يورو بيع</label><input type="number" id="s6" step="0.01"></div>
        <div class="field"><label>🇬🇧 جنيه شراء</label><input type="number" id="s7" step="0.01"></div>
        <div class="field"><label>🇬🇧 جنيه بيع</label><input type="number" id="s8" step="0.01"></div>
        <div class="field"><label>🇦🇪 درهم شراء</label><input type="number" id="s9" step="0.01"></div>
        <div class="field"><label>🇦🇪 درهم بيع</label><input type="number" id="s10" step="0.01"></div>
        <div class="field"><label>🇰🇼 دينار شراء</label><input type="number" id="s11" step="0.01"></div>
        <div class="field"><label>🇰🇼 دينار بيع</label><input type="number" id="s12" step="0.01"></div>
    </div></div>

    <div class="card"><h2>📍 عدن - العملات</h2><div class="grid">
        <div class="field"><label>💵 دولار شراء</label><input type="number" id="a1" step="0.01"></div>
        <div class="field"><label>💵 دولار بيع</label><input type="number" id="a2" step="0.01"></div>
        <div class="field"><label>🇸🇦 سعودي شراء</label><input type="number" id="a3" step="0.01"></div>
        <div class="field"><label>🇸🇦 سعودي بيع</label><input type="number" id="a4" step="0.01"></div>
        <div class="field"><label>💶 يورو شراء</label><input type="number" id="a5" step="0.01"></div>
        <div class="field"><label>💶 يورو بيع</label><input type="number" id="a6" step="0.01"></div>
        <div class="field"><label>🇬🇧 جنيه شراء</label><input type="number" id="a7" step="0.01"></div>
        <div class="field"><label>🇬🇧 جنيه بيع</label><input type="number" id="a8" step="0.01"></div>
        <div class="field"><label>🇦🇪 درهم شراء</label><input type="number" id="a9" step="0.01"></div>
        <div class="field"><label>🇦🇪 درهم بيع</label><input type="number" id="a10" step="0.01"></div>
        <div class="field"><label>🇰🇼 دينار شراء</label><input type="number" id="a11" step="0.01"></div>
        <div class="field"><label>🇰🇼 دينار بيع</label><input type="number" id="a12" step="0.01"></div>
    </div></div>

    <div class="card"><h2>🥇 ذهب وفضة - صنعاء</h2><div class="grid">
        <div class="field"><label>ذهب 21k شراء</label><input type="number" id="g1" step="0.01"></div>
        <div class="field"><label>ذهب 21k بيع</label><input type="number" id="g2" step="0.01"></div>
        <div class="field"><label>ذهب 22k شراء</label><input type="number" id="g3" step="0.01"></div>
        <div class="field"><label>ذهب 22k بيع</label><input type="number" id="g4" step="0.01"></div>
        <div class="field"><label>ذهب 24k شراء</label><input type="number" id="g5" step="0.01"></div>
        <div class="field"><label>ذهب 24k بيع</label><input type="number" id="g6" step="0.01"></div>
        <div class="field"><label>🥈 فضة شراء</label><input type="number" id="g7" step="0.01"></div>
        <div class="field"><label>🥈 فضة بيع</label><input type="number" id="g8" step="0.01"></div>
    </div></div>

    <div class="card"><h2>🥇 ذهب وفضة - عدن</h2><div class="grid">
        <div class="field"><label>ذهب 21k شراء</label><input type="number" id="h1" step="0.01"></div>
        <div class="field"><label>ذهب 21k بيع</label><input type="number" id="h2" step="0.01"></div>
        <div class="field"><label>ذهب 22k شراء</label><input type="number" id="h3" step="0.01"></div>
        <div class="field"><label>ذهب 22k بيع</label><input type="number" id="h4" step="0.01"></div>
        <div class="field"><label>ذهب 24k شراء</label><input type="number" id="h5" step="0.01"></div>
        <div class="field"><label>ذهب 24k بيع</label><input type="number" id="h6" step="0.01"></div>
        <div class="field"><label>🥈 فضة شراء</label><input type="number" id="h7" step="0.01"></div>
        <div class="field"><label>🥈 فضة بيع</label><input type="number" id="h8" step="0.01"></div>
    </div></div>

    <div class="card"><h2>🔩 معادن أخرى (USD)</h2><div class="grid3">
        <div class="field"><label>🪨 بلاتين</label><input type="number" id="m1" step="0.01"></div>
        <div class="field"><label>🪶 بلاديوم</label><input type="number" id="m2" step="0.01"></div>
        <div class="field"><label>🔩 ألومنيوم</label><input type="number" id="m3" step="0.01"></div>
        <div class="field"><label>🔶 نحاس</label><input type="number" id="m4" step="0.01"></div>
        <div class="field"><label>🥇 ذهب/أونصة</label><input type="number" id="m5" step="0.01"></div>
        <div class="field"><label>🥈 فضة/أونصة</label><input type="number" id="m6" step="0.01"></div>
    </div></div>

    <button onclick="gen()">📋 إنشاء JSON كامل</button>
    <textarea id="out" placeholder="JSON..."></textarea>
    <button class="btn-copy" onclick="copy()">📋 نسخ للكليبورد</button>
    <div id="msg"></div>
</div>

<script>
const V=id=>parseFloat(document.getElementById(id).value)||0;

async function load(){
  try{
    const r=await fetch("https://kaidngat4-droid.github.io/riyal-dollar-app/api/prices_data.json");
    const d=await r.json(), s=d.regions.sanaa, a=d.regions.aden;
    const sc=s.currencies, ac=a.currencies;
    // صنعاء عملات
    set('s1',sc.USD.buy);set('s2',sc.USD.sell);set('s3',sc.SAR.buy);set('s4',sc.SAR.sell);
    set('s5',sc.EUR.buy);set('s6',sc.EUR.sell);set('s7',sc.GBP.buy);set('s8',sc.GBP.sell);
    set('s9',sc.AED.buy);set('s10',sc.AED.sell);set('s11',sc.KWD.buy);set('s12',sc.KWD.sell);
    // عدن عملات
    set('a1',ac.USD.buy);set('a2',ac.USD.sell);set('a3',ac.SAR.buy);set('a4',ac.SAR.sell);
    set('a5',ac.EUR.buy);set('a6',ac.EUR.sell);set('a7',ac.GBP.buy);set('a8',ac.GBP.sell);
    set('a9',ac.AED.buy);set('a10',ac.AED.sell);set('a11',ac.KWD.buy);set('a12',ac.KWD.sell);
    // صنعاء ذهب
    set('g1',s.gold['21k'].buy);set('g2',s.gold['21k'].sell);set('g3',s.gold['22k'].buy);set('g4',s.gold['22k'].sell);
    set('g5',s.gold['24k'].buy);set('g6',s.gold['24k'].sell);set('g7',s.silver.buy);set('g8',s.silver.sell);
    // عدن ذهب
    set('h1',a.gold['21k'].buy);set('h2',a.gold['21k'].sell);set('h3',a.gold['22k'].buy);set('h4',a.gold['22k'].sell);
    set('h5',a.gold['24k'].buy);set('h6',a.gold['24k'].sell);set('h7',a.silver.buy);set('h8',a.silver.sell);
    // معادن
    const mt=d.metals||[];
    if(mt[0]){set('m1',mt[0].price_usd);} if(mt[1]){set('m2',mt[1].price_usd);}
    if(mt[2]){set('m3',mt[2].price_usd);} if(mt[3]){set('m4',mt[3].price_usd);}
    set('m5',d.gold?.ounce?.price_usd||2344); set('m6',d.silver?.price_usd||28.8);
  }catch(e){}
}
function set(id,v){if(v!=null)document.getElementById(id).value=v;}

function gen(){
  const ts=new Date().toISOString();
  const su=V('s1'),suS=V('s2'),au=V('a1'),auS=V('a2');
  const sarB=V('s3'),sarS=V('s4'),aSarB=V('a3'),aSarS=V('a4');
  const json={
    metadata:{app_name:"ريال ودولار",version:"1.0.0",last_updated:ts,base_currency:"YER",data_source:"manual_update"},
    regions:{
      sanaa:{
        name:"صنعاء",
        currencies:{
          USD:{buy:su,sell:suS},SAR:{buy:sarB,sell:sarS},
          EUR:{buy:V('s5'),sell:V('s6')},GBP:{buy:V('s7'),sell:V('s8')},
          AED:{buy:V('s9'),sell:V('s10')},KWD:{buy:V('s11'),sell:V('s12')}
        },
        gold:{"21k":{buy:V('g1'),sell:V('g2'),unit:"YER/gram"},"22k":{buy:V('g3'),sell:V('g4'),unit:"YER/gram"},"24k":{buy:V('g5'),sell:V('g6'),unit:"YER/gram"}},
        silver:{buy:V('g7'),sell:V('g8'),unit:"USD/oz"}
      },
      aden:{
        name:"عدن",
        currencies:{
          USD:{buy:au,sell:auS},SAR:{buy:aSarB,sell:aSarS},
          EUR:{buy:V('a5'),sell:V('a6')},GBP:{buy:V('a7'),sell:V('a8')},
          AED:{buy:V('a9'),sell:V('a10')},KWD:{buy:V('a11'),sell:V('a12')}
        },
        gold:{"21k":{buy:V('h1'),sell:V('h2'),unit:"YER/gram"},"22k":{buy:V('h3'),sell:V('h4'),unit:"YER/gram"},"24k":{buy:V('h5'),sell:V('h6'),unit:"YER/gram"}},
        silver:{buy:V('h7'),sell:V('h8'),unit:"USD/oz"}
      }
    },
    currencies:[
      {code:"USD",name_ar:"دولار أمريكي",flag:"🇺🇸",price_yer:(su+au)/2,buy:(su+au)/2,sell:(suS+auS)/2,sanaa_buy:su,sanaa_sell:suS,aden_buy:au,aden_sell:auS,change_24h:0,change_percent:0,trend:"stable"},
      {code:"SAR",name_ar:"ريال سعودي",flag:"🇸🇦",price_yer:(sarB+aSarB)/2,buy:(sarB+aSarB)/2,sell:(sarS+aSarS)/2,sanaa_buy:sarB,sanaa_sell:sarS,aden_buy:aSarB,aden_sell:aSarS,change_24h:0,change_percent:0,trend:"stable"}
    ],
    gold:{ounce:{price_usd:V('m5'),change_24h:0,change_percent:0,trend:"stable"}},
    silver:{code:"XAG",name_ar:"الفضة",icon:"🥈",price_usd:V('m6'),unit:"oz",status:"live"},
    metals:[
      {code:"XPT",name_ar:"البلاتين",icon:"🪨",price_usd:V('m1'),unit:"oz",trend:"stable"},
      {code:"XPD",name_ar:"البلاديوم",icon:"🪶",price_usd:V('m2'),unit:"oz",trend:"stable"},
      {code:"AL",name_ar:"الألومنيوم",icon:"🔩",price_usd:V('m3'),unit:"kg",trend:"stable"},
      {code:"HG",name_ar:"النحاس",icon:"🔶",price_usd:V('m4'),unit:"kg",trend:"stable"}
    ]
  };
  document.getElementById('out').value=JSON.stringify(json,null,2);
  document.getElementById('msg').innerHTML='<div class="msg success">✅ تم! اضغط نسخ ثم الصقه في api/prices_data.json</div>';
}

function copy(){
  const t=document.getElementById('out').value;
  if(!t)return;
  navigator.clipboard.writeText(t).then(()=>{
    document.getElementById('msg').innerHTML='<div class="msg success">✅ تم النسخ! اذهب لـ GitHub → api/prices_data.json → Edit → Paste → Commit</div>';
  });
}
load();
</script>
</body>
</html>
