<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | ريال ودولار</title>
    <style>
        :root { --primary: #f59e0b; --bg: #0f172a; --text: #f8fafc; --muted: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .icon { font-size: 6rem; animation: bounce 2s infinite; }
        h1 { font-size: 6rem; background: linear-gradient(135deg, var(--primary), #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: var(--muted); font-size: 1.2rem; margin: 1rem 0 2rem; }
        a { display: inline-block; padding: 1rem 2rem; background: linear-gradient(135deg, var(--primary), #fbbf24); color: var(--bg); text-decoration: none; border-radius: 1rem; font-weight: 700; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>
<body>
    <div>
        <div class="icon">🪙</div>
        <h1>404</h1>
        <p>الصفحة غير موجودة</p>
        <a href="/">العودة للرئيسية</a>
    </div>
</body>
</html>
