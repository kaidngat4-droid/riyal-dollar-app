name: تحديث الأسعار

on:
  schedule:
    - cron: '0 */2 * * *'  # كل ساعتين
  workflow_dispatch:  # يدوي

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      
      - name: Update prices
        run: python update_prices_auto.py
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add api/prices_data.json api/gold-prices.json yemen_rates.json
          git diff --staged --quiet || git commit -m "✅ تحديث الأسعار $(date +'%Y-%m-%d %H:%M')"
          git push
