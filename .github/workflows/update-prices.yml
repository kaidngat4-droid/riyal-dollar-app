name: تحديث الأسعار
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python update_prices_auto.py
      - run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add api/prices_data.json
          git diff --staged --quiet || git commit -m "✅ تحديث $(date +'%Y-%m-%d')"
          git push
